<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f5ee">
  <meta name="description" content="TouchHub maps touch recorded by a human glove onto the tactile sensors of a robot hand, without paired contact recordings or retraining.">
  <title>TouchHub: Tactile Retargeting from Human Gloves to Dexterous Hands without Retraining</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      color-scheme: light;
      background: #f5f5ee;
      color: #192f2a;
      font-family: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
    }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      align-items: center;
      padding: clamp(24px, 7vw, 96px);
    }
    main {
      width: min(100%, 72rem);
      margin: auto;
      padding-block: clamp(36px, 6vw, 80px);
      border-block: 1px solid #acb9ae;
    }
    h1, p { margin: 0; }
    h1 { font-weight: 500; }
    .name {
      display: block;
      margin-bottom: clamp(24px, 4vw, 56px);
      font-size: clamp(3.6rem, 14vw, 12rem);
      line-height: .88;
      letter-spacing: -.082em;
    }
    .name span { color: #256e55; }
    .subtitle {
      display: block;
      max-width: 30ch;
      font-family: "Instrument Serif", Georgia, serif;
      font-size: clamp(1.7rem, 3.6vw, 3.1rem);
      line-height: 1.12;
      letter-spacing: -.032em;
      text-wrap: balance;
    }
    p {
      max-width: 57ch;
      margin-top: 1.35rem;
      color: #43564c;
      font-size: clamp(1rem, 1.5vw, 1.18rem);
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main>
    <h1>
      <span class="name">Touch<span>Hub</span></span>
      <span class="subtitle">Tactile Retargeting from Human Gloves to Dexterous Hands without Retraining</span>
    </h1>
    <p>TouchHub maps touch recorded by a human glove onto the tactile sensors of a robot hand, without paired contact recordings or retraining.</p>
  </main>
</body>
</html>
